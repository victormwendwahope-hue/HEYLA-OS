events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Allow uploads up to the backend's 400MB cap (nginx default is 1MB — would 413 all large uploads).
    # HEYLA CONNECT lets users post 1080p video clips (max 5 min).
    client_max_body_size 400m;

    # gzip static + API responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Brute-force protection for auth endpoints (rate limited per client IP)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ---- Security headers (AWS ALB terminates TLS; HSTS only when request arrived over HTTPS) ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://heyla-backend.onrender.com https://api.safaricom.co.ke https://api.stripe.com https://api.paystack.co https://oauth2.googleapis.com https://api.linkedin.com; frame-src https://js.stripe.com https://checkout.stripe.com https://api.paystack.co; frame-ancestors 'self'; form-action 'self' https://checkout.stripe.com https://api.paystack.co; base-uri 'self'" always;
        if ($http_x_forwarded_proto = "https") {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # API proxy to Odoo backend
        location /api/ {
            proxy_pass http://odoo:8069/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Rate-limit auth brute force (never rate-limit webhooks/callbacks)
        location = /api/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://odoo:8069/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
        location = /api/auth/register {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://odoo:8069/api/auth/register;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Odoo web interface
        location /odoo/ {
            proxy_pass http://odoo:8069/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Never serve dotfiles / VCS metadata
        location ~ /\.(?!well-known) {
            deny all;
        }

        # Serve frontend static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache-busting: hashed assets (long cache)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Logo, favicon, svg (no cache — use ?v=N to bypass)
        location ~* \.(ico|svg)$ {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /logo.png {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /placeholder.svg {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
